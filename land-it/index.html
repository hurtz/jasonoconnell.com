<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Land It</title><meta name="description" content="Land It, a guitar soloing coach: land the right chord tone on every change."><meta name="theme-color" content="#EEEAE4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Land It"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><style>:root{color-scheme:light} body{margin:0}</style></head><body><title>Land It</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Righteous&family=Karla:wght@400;500;700;800&display=swap">
<style>
/* Layout: a workbench. One slim bar (name, song, play), the song's chords, then the full 24 fret neck edge to edge as the hero, one row of switches under it, chord shapes last. */
:root{
  --bg:#EEEAE4; --surface:#FBF9F6; --ink:#23191A; --muted:#6F6466; --line:#DCD4CB; --chip:#E6E0D7;
  --accent:#B4551C; --accent-ink:#FFFFFF; --shadow:rgba(46,26,14,.18); --fn:#7B6F70;
  --display:'Righteous','Trebuchet MS',system-ui,sans-serif;
  --body:'Karla',system-ui,-apple-system,'Segoe UI',sans-serif;
  /* notes sit on the wood, so they keep one set of colors in both themes */
  --n-r:#E8493A; --n-3:#F5B623; --n-5:#1FA597; --n-7:#9271E6; --n-9:#5B8FEA; --n-s:#F7F0E2; --n-ink:#1C120D;
  --c-r:var(--n-r); --c-3:var(--n-3); --c-5:var(--n-5); --c-7:var(--n-7); --c-9:var(--n-9); --dot-ink:var(--n-ink);
  --ok:#2FD07F; --wood1:#4B2E1D; --wood2:#2D1A10; --grain:#190B04; --fret:#DAD3C7; --str:#EFE8DA; --inlay:#F0E8D6; --nut:#F2ECDF; --frame:#FFD39A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17120F; --surface:#211A15; --ink:#F3ECE4; --muted:#AA9D93; --line:#3A2F28; --chip:#2C231D;
    --accent:#EE9A4E; --accent-ink:#1A0E06; --shadow:rgba(0,0,0,.55); --fn:#A2958B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17120F; --surface:#211A15; --ink:#F3ECE4; --muted:#AA9D93; --line:#3A2F28; --chip:#2C231D;
  --accent:#EE9A4E; --accent-ink:#1A0E06; --shadow:rgba(0,0,0,.55); --fn:#A2958B;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.45}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1280px; margin:0 auto}

/* top bar */
.top{display:grid; grid-template-columns:minmax(0,1fr); gap:14px; padding-block:18px 6px}
.bar{display:flex; align-items:center; gap:10px 16px; flex-wrap:wrap}
.mark{font-family:var(--display); font-weight:400; font-size:25px; line-height:1; margin:0; display:flex; align-items:center; gap:10px}
.mark i{display:inline-grid; grid-template-columns:repeat(2,9px); gap:3px}
.mark i b{width:9px; height:9px; border-radius:50%}
.songbtn{display:inline-flex; align-items:baseline; gap:9px; min-width:0; max-width:100%; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:9px 14px; box-shadow:0 8px 18px -14px var(--shadow)}
.songbtn:hover{border-color:var(--muted)}
.songbtn .st{font-weight:800; font-size:17px; white-space:nowrap}
.songbtn .sa{color:var(--muted); font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.songbtn .cv{color:var(--muted); font-size:12px}
.playgrp{margin-left:auto; display:flex; gap:8px; align-items:center}
.play{border:0; border-radius:99px; background:var(--accent); color:var(--accent-ink); font-weight:800; font-size:17px; padding:11px 26px; min-width:118px; box-shadow:0 10px 22px -12px var(--accent)}
.play[aria-pressed="true"]{background:var(--ink); color:var(--bg); box-shadow:none}
.tempo{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:6px 8px 6px 16px}
.tempo label{font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.tempo input{width:150px; accent-color:var(--accent)}
.tempo output{min-width:92px; font-size:14px; font-weight:700; color:var(--muted); line-height:1.1; display:grid}
.tempo output b{color:var(--ink); font-size:17px}
.tempo output small{font-size:11px; font-weight:800; color:var(--accent)}
.treset{border:0; background:var(--chip); border-radius:99px; padding:6px 12px; font-size:12px; font-weight:800; white-space:nowrap}
@media (max-width:480px){ .tempo label{display:none} .tempo{padding-left:12px} .tempo output{min-width:70px} .play{min-width:0; padding:11px 18px} }
@media (max-width:620px){ .playgrp{width:100%; margin-left:0} .tempo{flex:1; min-width:0} .tempo input{width:auto; flex:1; min-width:60px} }
.tap{border:2px solid var(--accent); background:var(--surface); color:var(--ink); border-radius:99px; font-weight:800; font-size:16px; padding:9px 20px}
.tap.pop{animation:pop .35s ease-out}
@keyframes pop{from{box-shadow:0 0 0 0 var(--accent)} to{box-shadow:0 0 0 14px transparent}}

/* chord row */
.chordrow{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px 18px}
.chordrow .meta{justify-self:start}
.chordrow .chips{justify-content:center}
.beat{justify-self:end; display:grid; justify-items:end; min-width:130px; line-height:1}
.beat b{font:400 40px/1 var(--display); color:var(--ink)}
.beat b.ready{color:var(--accent)} .beat b.change{color:var(--n-r)}
.beat b:empty{display:none}
.beat small{max-width:280px; text-align:right; line-height:1.35; margin-top:4px; font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.chip .bars{display:flex; gap:5px; margin-top:2px}
.chip .bar{display:flex; gap:2px}
.chip .bar i{width:7px; height:7px; border-radius:2px; background:var(--line)}
.chip .bar i.done{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.chip .bar i.now{background:var(--accent); transform:scale(1.25)}
.chips{display:flex; gap:8px; flex-wrap:wrap; min-width:0}
@media (max-width:700px){ .chordrow{grid-template-columns:minmax(0,1fr) auto} .beat small{max-width:40vw} .chordrow .chips{grid-column:1/-1; grid-row:2; justify-content:flex-start; flex-wrap:nowrap; overflow-x:auto; padding-bottom:4px; scrollbar-width:none} .chip{flex:none} .beat{min-width:0} .beat b{font-size:30px} }
.chip{position:relative; overflow:hidden; display:grid; justify-items:start; gap:3px; min-width:66px; padding:8px 14px 10px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); font-weight:800; font-size:21px; line-height:1}
.chip small{font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.04em}
.chip .rn{font-size:11px; font-weight:800; color:var(--muted); letter-spacing:.06em}
.chip.off{background:transparent; border-style:dashed; color:var(--muted); font-weight:700}
.chip.off .rn{opacity:.8}
.chip.song{box-shadow:0 6px 14px -12px var(--shadow)}
.chip:hover{border-color:var(--muted)}
.chip[aria-current="true"]{border-color:var(--accent); background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.chip.nx{border-style:dashed; border-color:var(--muted)}
.chip::after{content:""; position:absolute; left:0; bottom:0; height:3px; width:calc(var(--p,0) * 100%); background:var(--accent); transition:width .12s linear}
.meta{display:grid; gap:2px; line-height:1.1}
.meta .kl{font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.meta .kn{font:400 30px/1.05 var(--display); color:var(--ink); white-space:nowrap}
.meta .kt{font-size:12.5px; font-weight:700; color:var(--accent)}

/* the neck */
.neckband{position:relative; padding-block:4px 0}
.neckwrap{max-width:1680px; margin:0 auto; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:thin}
#neck{display:block; width:100%; height:auto; filter:drop-shadow(0 16px 22px var(--shadow)); touch-action:pan-x pan-y; user-select:none; -webkit-user-select:none}
#neck.grab{cursor:grab} #neck.grab:active{cursor:grabbing}
@media (max-width:900px){ #neck{min-width:1060px} }
.count{position:absolute; inset:0; display:grid; place-items:center; pointer-events:none}
.count b{font:400 120px/1 var(--display); color:#FFF6E8; text-shadow:0 6px 30px rgba(0,0,0,.55)}
.count b.pop{animation:cpop .5s ease-out}
@keyframes cpop{from{transform:scale(1.25); opacity:.3} to{transform:none; opacity:1}}

/* neck drawing */
.wood{fill:url(#wood)}
.inlay{fill:var(--inlay); opacity:.42}
.fret{stroke:var(--fret); stroke-width:3}
.fret2{stroke:#fff; stroke-opacity:.25; stroke-width:1}
.nut{fill:var(--nut)}
.str{stroke:var(--str); stroke-linecap:round}
.sn{fill:var(--muted); font:800 13px var(--body); text-anchor:middle; dominant-baseline:central}
.fn{fill:var(--fn); font:700 12.5px var(--body); text-anchor:middle; font-variant-numeric:tabular-nums}
.fn.in{fill:var(--ink); font-weight:800}
.fn.hit{fill:var(--accent)!important; font-size:19px; font-weight:800; visibility:visible!important}
.fglow{fill:#FFE4B0; opacity:0; transition:opacity .12s; pointer-events:none}
.fglow.on{opacity:.26}
.snb{fill:transparent; cursor:pointer} .snb:hover{fill:var(--chip)} .snb.on{fill:var(--accent)}
.sn{pointer-events:none} .sn.on{fill:var(--accent-ink)}
.str.solo{stroke:#FFE6B8; filter:drop-shadow(0 0 4px rgba(255,214,150,.8))} .str.mute{opacity:.35}
.ivl{fill:none; stroke:#FFE6B8; stroke-width:1.6; stroke-opacity:.8}
.ivt{fill:#FFF3DC; font:800 13px var(--body); text-anchor:middle; dominant-baseline:central; paint-order:stroke; stroke:#2A170C; stroke-width:4px; stroke-linejoin:round}
.pos .exit{border:0; background:none; color:var(--accent); font:inherit; font-size:12px; font-weight:800; padding:0; text-decoration:underline; cursor:pointer}
.eqp{fill:var(--accent)} .eqt{fill:var(--accent-ink)!important; font-weight:800} .eqt.hit{fill:var(--accent-ink)!important}
.eql{fill:var(--accent); font:800 9.5px var(--body); text-anchor:middle; letter-spacing:.1em; text-transform:uppercase}
.eqline{stroke:var(--frame); stroke-width:2; stroke-dasharray:3 5; opacity:.7}
.frame{fill:#FFF3DF; fill-opacity:.07; stroke:var(--frame); stroke-width:2.4}
.bk{fill:none; stroke:var(--muted); stroke-width:1.5; stroke-opacity:.45}
.bkc{fill:var(--chip); stroke:var(--line)}
.bkt{fill:var(--ink); font:800 11px var(--body); text-anchor:middle; dominant-baseline:central; pointer-events:none}
.bkg{cursor:pointer} .bkhit{fill:transparent; pointer-events:all} .bkc{pointer-events:all}
.bkg:hover .bkc{stroke:var(--muted)}
.bkg.on .bk{stroke:var(--accent); stroke-opacity:1; stroke-width:2.2}
.bkg.on .bkc{fill:var(--accent); stroke:var(--accent)} .bkg.on .bkt{fill:var(--accent-ink)}
.bkg.mute .bk{display:none} .bkg.mute .bkc{fill:none; stroke:var(--line)} .bkg.mute .bkt{fill:var(--muted); font-weight:700}
.arwbg{fill:none; stroke:#1A0D06; stroke-width:7; stroke-linecap:round; opacity:.55}
.arw{fill:none; stroke:#FFF0D2; stroke-width:3; stroke-linecap:round}
.arw.wide{stroke-dasharray:6 5; stroke-width:2.4}
.ahp{fill:#FFF0D2}

/* notes */
.m{cursor:pointer}
.m.off{pointer-events:none}
.m .mi{transition:transform .26s cubic-bezier(.3,1.4,.5,1),opacity .2s}
.m.off .mi{transform:scale(.2); opacity:0}
.m.on .mi{transform:none; opacity:1}
.m.dim .mi{transform:scale(.5); opacity:.5}
.m.dim text{opacity:0}
.m .sh{fill:rgba(0,0,0,.5)}
.m .dot{stroke:rgba(20,8,2,.55); stroke-width:1.2; transition:fill .2s, stroke .6s ease-out, stroke-width .6s ease-out}
.m.scale .dot{fill:var(--n-s)}
.m .gl{pointer-events:none}
.m text{fill:var(--n-ink); font-family:var(--body); font-weight:800; text-anchor:middle; dominant-baseline:central; pointer-events:none; letter-spacing:-.02em}
.m .ring{fill:none; stroke-width:3; opacity:0}
.m.ghost .mi{transform:scale(.92); opacity:1}
.m.ghost .dot,.m.ghost .sh,.m.ghost .gl{opacity:0}
.m.ghost .ring{opacity:1; fill:#1E120B; fill-opacity:.82; stroke-dasharray:4 3}
.m.land .ring{opacity:1; stroke-dasharray:4 3}
.m.hold .ring{opacity:1; stroke:#FFF0D2; stroke-dasharray:2 4}
.m.arrive .mi{animation:arrive .42s cubic-bezier(.2,1.4,.4,1) both; animation-delay:var(--d,0ms)}
@keyframes arrive{0%{transform:scale(.4); opacity:.4} 65%{transform:scale(1.12); opacity:1} 100%{transform:none; opacity:1}}
.m.arrive .ring{opacity:0; stroke:#FFF0D2; transform-box:fill-box; transform-origin:center; animation:ripple .7s ease-out both; animation-delay:var(--d,0ms)}
/* motion pack */
.shd{fill:#0B0502; opacity:.4; pointer-events:none}
.m.pre .ring{opacity:1; stroke-width:3; animation:prepulse .45s ease-in-out infinite alternate}
@keyframes prepulse{from{opacity:.3} to{opacity:1}}
.m.bt .mi{animation:bump .2s ease-out} .m.bt1 .mi{animation:bump1 .24s ease-out}
@keyframes bump{0%{transform:none} 35%{transform:scale(1.09)} 100%{transform:none}}
@keyframes bump1{0%{transform:none} 35%{transform:scale(1.17)} 100%{transform:none}}
.m.trail .dot{stroke:#FFF6E0; stroke-width:3.4; transition:none}
.trl{stroke:#FFF0D2; stroke-width:4; stroke-linecap:round; opacity:0; animation:trl 1.05s ease-out; pointer-events:none}
@keyframes trl{0%{opacity:.75} 100%{opacity:0}}
@keyframes ripple{0%{opacity:.95; transform:scale(.8)} 100%{opacity:0; transform:scale(1.7)}}
.chip.pop{animation:cardpop .4s ease-out}
.m.hit .mi{transform:scale(1.3)!important; opacity:1!important}
.m.hit .dot{stroke:#fff; stroke-width:3.5}
.m.hit text{opacity:1!important}
.m.rub .dot{fill:#E9DFD0} .m.rub text{opacity:.7}
.m.rub .ring{opacity:1; r:21; stroke:#E8493A; stroke-width:2.6; stroke-dasharray:3.5 3}
.m.dim.rub .ring{opacity:0}
.bkg.ping .bk{display:block; stroke:var(--accent); stroke-opacity:1; stroke-width:2.2}
.bkg.ping .bkc{fill:var(--frame); stroke:var(--accent)} .bkg.ping .bkt{fill:var(--n-ink); font-weight:800}
.chip.ping{border-color:var(--accent); border-style:solid; box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.tn.ping rect{fill:var(--accent)} .tn.ping text{fill:var(--accent-ink)}
.csvg .cd.ping{stroke:var(--ink); stroke-width:3} .csvg .co.ping{stroke:var(--ink); stroke-width:3} .csvg .cn.ping{fill:var(--accent); font-weight:800}
.parts li{border-radius:99px; padding:2px 10px 2px 2px; transition:background .15s}
.parts li.ping{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.parts li.ping i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}

/* switches under the neck */
.tools{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px 20px; padding-block:14px 22px}
.grp{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.lay{display:inline-flex; align-items:center; gap:9px; border:1.5px solid var(--line); background:var(--surface); border-radius:99px; padding:8px 15px 8px 10px; font-weight:800; font-size:15px; color:var(--muted)}
.lay svg{width:34px; height:20px; flex:none}
.lay[aria-pressed="true"]{border-color:var(--ink); color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.lay[aria-pressed="false"] svg{opacity:.35; filter:grayscale(1)}
.slide{gap:6px}
.nav{width:40px; height:40px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface); font-size:24px; font-weight:800; line-height:1; display:grid; place-items:center; padding-bottom:3px}
.nav:hover:not(:disabled){border-color:var(--muted)}
.nav:disabled{opacity:.3; cursor:default}
.pos{min-width:178px; text-align:center; font-weight:800; font-size:16px; line-height:1.15}
.pos small{display:block; font-size:12px; font-weight:700; color:var(--muted)}
.seg{display:inline-flex; gap:2px; padding:3px; border-radius:12px; background:var(--chip)}
.seg button{border:0; background:transparent; border-radius:9px; padding:7px 12px; font-weight:800; font-size:14px; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px var(--shadow)}

/* arpeggio tab */
.tabband{max-width:1680px; margin:0 auto}
.tabsec{display:grid; gap:10px; padding-block:2px 24px}
.tabhead{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between}
.tabhead h2{font-family:var(--display); font-weight:400; font-size:21px; margin:0; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
.tabhead h2 small{font-family:var(--body); font-size:14px; font-weight:700; color:var(--muted)}
.tab{display:flex; flex-wrap:wrap; justify-content:safe center; row-gap:16px; overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 18px 10px}
.tseg{display:block; flex:none; height:auto}
.tl{stroke:var(--muted); stroke-opacity:.5; stroke-width:1}
.tbar{stroke:var(--ink); stroke-opacity:.7; stroke-width:1.5}
.tname{font:800 18px var(--body); fill:var(--ink)}
.tdir{font:800 13px var(--body); fill:var(--accent)}
.tsn{font:800 12px var(--body); fill:var(--muted); text-anchor:middle; dominant-baseline:central}
.tn{cursor:pointer}
.tn rect{fill:var(--surface)}
.tn text{font:800 17px var(--body); fill:var(--ink); text-anchor:middle; dominant-baseline:central; font-variant-numeric:tabular-nums}
.tn line{stroke-width:3; stroke-linecap:round}
.tn.on rect{fill:var(--accent)} .tn.on text{fill:var(--accent-ink)}
.btn2{border:0; border-radius:99px; background:var(--ink); color:var(--bg); font-weight:800; font-size:14px; padding:8px 16px; white-space:nowrap}
.btn2.ghost{background:var(--chip); color:var(--ink)}
.tabnote{margin:0; font-size:15px; color:var(--muted)} .tabnote:empty{display:none} .tabnote b{color:var(--ink)}
/* chord shapes */
.shapes{display:grid; gap:12px; padding-block:6px 60px}
.shapes h2{font-family:var(--display); font-weight:400; font-size:21px; margin:0; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; justify-content:center}
.shapes h2 small{font-family:var(--body); font-size:14px; font-weight:700; color:var(--muted)}
.cards{display:flex; flex-wrap:wrap; justify-content:center; gap:14px}
.cards .card{width:min(100%,320px)}
.card{display:grid; grid-template-columns:118px 1fr; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px}
.card{position:relative; transition:border-color .2s, background .2s, box-shadow .2s}
.card.cur{border:2px solid var(--accent); background:color-mix(in srgb,var(--accent) 10%,var(--surface)); box-shadow:0 10px 26px -16px var(--accent)}
.card.nx{border-style:dashed; border-color:var(--muted)}
.card .tag{position:absolute; top:12px; right:14px; font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.card.cur .tag{color:var(--accent)}
.card.flash{animation:cardpop .45s ease-out}
@keyframes cardpop{from{transform:scale(1.03)} to{transform:none}}
.card h3{grid-column:1/-1; margin:0; font-size:22px; font-weight:800; line-height:1}
.chart{border:0; background:none; padding:0; border-radius:10px}
.chart:hover{background:var(--chip)}
.parts{list-style:none; margin:0; padding:0; display:grid; gap:7px}
.parts li{display:flex; align-items:center; gap:9px; font-weight:800; font-size:16px}
.parts li i{display:grid; place-items:center; width:28px; height:28px; border-radius:50%; font:800 12px/1 var(--body); font-style:normal; color:var(--n-ink); box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.parts li span{color:var(--muted); font-weight:700; font-size:13px}
.csvg{width:100%; height:auto; display:block}
.csvg .cl{stroke:var(--muted); stroke-width:1; stroke-opacity:.45}
.csvg .cnut{fill:var(--ink)}
.csvg .cfr{font:800 10px var(--body); fill:var(--muted)}

/* ---------- arpeggio tab: the chord tones inside one box, written out like a lesson sheet ---------- */
function tabBox(){const fi=focusInfo(); if(fi) return fi.list[fi.n===2?1:0]; return insts()[defaultFocus(1)];}
function arpNotes(c,box){
  const tm=tmap(c), a=box.a, b=box.b, mid=(a+b)/2, by=new Map();
  const score=n=>(n.f<a||n.f>b?10:0)+(n.f>b?1:0)+Math.abs(n.f-mid)*.01;
  for(let s2=0;s2<6;s2++) for(let fr=Math.max(0,a-1);fr<=Math.min(FRETS,b+1);fr++){const pc=mod(STD[s2]+fr); if(!tm.has(pc)) continue; const n={s:s2,f:fr,midi:STD[s2]+fr,i:tm.get(pc)}, o=by.get(n.midi); if(!o||score(n)<score(o)) by.set(n.midi,n);}
  return [...by.values()].sort((x,y)=>x.midi-y.midi);
}
function tabSeq(){
  const f=form(), box=tabBox(), segs=[], n=f.length;
  if(S.str!=null) return stringRun(box);
  if(VIEW){let notes=arpNotes(VIEW,box); if(S.tabDir==='down') notes=notes.slice().reverse(); return {box,segs:notes.length?[{c:VIEW,notes,d:S.tabDir==='down'?-1:1}]:[]};}
  for(let k=0;k<n;k++){const c=f[(idx+k)%n]; if(k>0&&c.name===f[(idx+k-1)%n].name) continue;
    const d=S.tabDir==='alt'?(segs.length%2?-1:1):(S.tabDir==='down'?-1:1); let notes=arpNotes(c,box); if(d<0) notes=notes.slice().reverse(); if(notes.length) segs.push({c,notes,d});}
  if(segs.length>1&&segs[segs.length-1].c.name===segs[0].c.name) segs.pop();
  return {box,segs};
}
function stringRun(box){
  const one=S.str, c=curChord(), cm=tmap(c), ps=pentSet(), L=S.lay, usePent=L.pent||!L.chord, home=usePent?keyS():c.r, list=[];
  for(let fr=0;fr<=FRETS;fr++){const pc=mod(STD[one]+fr); if(usePent?ps.has(pc):cm.has(pc)) list.push({s:one,f:fr,midi:STD[one]+fr,i:cm.has(pc)?cm.get(pc):null});}
  const roots=list.filter(n=>mod(n.midi)===home); let up=list;
  if(roots.length>=2) up=list.filter(n=>n.f>=roots[0].f&&n.f<=roots[roots.length-1].f);
  const name=`${['Low E','A','D','G','B','High e'][one]} string`, segs=[];
  if(S.tabDir!=='down') segs.push({c,notes:up,d:1,label:name});
  if(S.tabDir!=='up') segs.push({c,notes:(S.tabDir==='alt'?up.slice(0,-1):up).slice().reverse(),d:-1,label:S.tabDir==='alt'?'and back':name});
  return {box,segs,run:true,usePent,gaps:up.slice(1).map((n,j)=>n.f-up[j].f)};
}

let glowT=null;

}
function litAt(s2,f2,ms,c,i){
  const m=M[s2*(FRETS+1)+f2]; if(!m) return;
  if(c&&i!=null&&(m.state==='off'||m.state==='dim')){m.dot.style.fill=`var(--n-${roleOf(i,c.ints)})`; const pc=mod(STD[s2]+f2), [a,b]=labelPair(pc,deg(i,c.ints),i===0); setText(m,a,b);}

}

/* ---------- play along ---------- */
let pIdx=0, pStep=0, nextT=0, schedId=null, cbars=1; const pend=new Set();
const stepDur=()=>60/bpm()/2, spb=()=>song().bpb*2;
function later(t,fn){ if(!actx){fn(); return;} const id=setTimeout(()=>{pend.delete(id); if(playing) fn();},Math.max(0,(t-actx.currentTime)*1000)); pend.add(id); }
function runStep(t){
  const f=form(), n=spb();
  if(pStep<0){const s=pStep+cbars*n; if(s%2===0){const k=s/2+1; if(actx) stick(t,k===1); later(t,()=>countVis(k));} pStep++; return;}
  if(pIdx>=f.length) pIdx=0;
  if(pStep>=f[pIdx].bars*n){pIdx=(pIdx+1)%f.length; pStep=0;}
  const c=f[pIdx], s=pStep%n, st=pattern(), tt=t+((s%2&&st.swing)?stepDur()*st.swing:0);
  if(actx){ if(S.sound==='band') playBand({r:c.cr,ints:c.ints},s,tt,st); else if(S.sound==='click'&&s%2===0) blip(t,s===0); }
  if(alongOn()&&ALONG){const evs=ALONG.map.get(pIdx+':'+pStep); if(evs) evs.forEach(ev=>{ if(!S.myTurn&&actx) pluckAt(realMidi(ev.s,ev.f),t,ev.dur*60/bpm(),ev.bend); later(t,()=>alongLight(ev)); });}
  if(s%2===0){const pi=pIdx, b=pStep/2; later(t,()=>onBeat(pi,b));}
  pStep++;
}
function scheduler(){while(nextT<actx.currentTime+.12){runStep(nextT); nextT+=stepDur();}}
function countVis(k){$('beatBig').textContent=k; $('beatBig').className=''; $('beatSub').textContent='count in'; $('beat').hidden=false; $('count').hidden=false; const b=$('countNum'); b.textContent=k; b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');}

/* storage: shared db when available, else this browser */
let db=null, sampler=null, samplerP=null, lookCtl=null;
async function persist(sg){
  const rec=toRecord(sg);
  if(db){ try{ await db.collection('songs').doc(sg.id).set(rec); dbSongs=dbSongs.filter(x=>x.id!==sg.id).concat([normalize(Object.assign({},rec,{id:sg.id,where:'shared'}))]); invalidate(); return 'shared'; }catch(e){} }
  S.local=S.local.filter(r=>r.id!==sg.id).concat([Object.assign({id:sg.id},rec)]); save(); invalidate(); return 'local';
}
async function removeSong(id){
  const sg=library().find(s=>s.id===id); if(!sg) return;
  if(sg.where==='shared'&&db){try{await db.collection('songs').doc(id).delete(); dbSongs=dbSongs.filter(x=>x.id!==id);}catch(e){note('Could not remove that song. Try again.',true); return;}}
  else if(sg.where==='local') S.local=S.local.filter(r=>r.id!==id);
  else S.hidden=S.hidden.concat([id]);
  save(); invalidate(); if(S.cur===id) S.cur=(library()[0]||{}).id; renderLib(); renderAll();
}
function note(t,err){const n=$('note'); n.textContent=t; n.classList.toggle('err',!!err);}
async function lookup(q){
  if(!sampler&&samplerP){note('Connecting to Claude.'); await samplerP;}
  if(!sampler){note('Song lookup works when this page is open in Claude.',true); return;}
  lookCtl=new AbortController(); const go=$('go'); go.textContent='Stop';
  note('Finding the solo chords, key and tempo. This can take up to a minute.');
  try{
    const sg=fromLookup(await sampler.json(PROMPT(q),{signal:lookCtl.signal,modelTier:'default'}));
    await persist(sg); $('q').value=''; note(`Added ${sg.title}.`); selectSong(sg.id); renderLib(); fillOpts();
  }catch(e){
    const c=e&&e.code;
    if(c==='cancelled') note('Stopped.');
    else if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'){sampler=null; note('Song lookup is turned off for this view.',true);}
    else if(c==='rate_limited') note('Too many lookups right now. Try again in a minute.',true);
    else if(c==='unknown') note(`Claude didn't recognize that song: ${e.message}. Try adding the artist.`,true);
    else note("Couldn't read the chords from the answer. Try again, or add the artist name.",true);
  }finally{ lookCtl=null; go.textContent='Look up'; }
}

(()=>{ // the neck: tap a note to hear it, drag (or tap outside the box) to slide the box
  const svg=$('neck'); let st=null;
  const fretAt=x=>{const r=svg.getBoundingClientRect(), vx=(x-r.left)/r.width*VBW; for(let f=0;f<=FRETS;f++) if(vx<FX[f]) return f; return FRETS;};
  const nearest=fr=>{const fi=focusInfo(); if(!fi) return null; const ins=insts(); let best=0, bd=1e9; for(let i=0;i<=fi.max;i++){const l=ins.slice(i,i+fi.n), c=(Math.min(...l.map(b=>b.a))+Math.max(...l.map(b=>b.b)))/2, d=Math.abs(c-fr); if(d<bd){bd=d; best=i;}} return best;};
  svg.addEventListener('pointerdown',e=>{st={x:e.clientX,moved:false,mouse:e.pointerType!=='touch'};});
  svg.addEventListener('pointermove',e=>{ if(!st||!st.mouse||!e.buttons) return; const fi=focusInfo(); if(!fi) return; if(Math.abs(e.clientX-st.x)>6) st.moved=true; if(st.moved){const i=nearest(fretAt(e.clientX)); if(i!=null&&i!==fi.i) setFocus(i);} });
  svg.addEventListener('click',e=>{
    const s0=st; st=null; if(s0&&s0.moved) return;
    const sb=e.target.closest('.snb'); if(sb){const v=+sb.dataset.s; setStr(S.str===v?null:v); return;}
    const bk=e.target.closest('.bkg');
    if(bk){const i=+bk.dataset.i; if(S.focus==='all'){S.focus='1'; save();} const fi=focusInfo(); setFocus(fi.n===2?Math.min(i,fi.max):i); renderTools(); renderNeck(); return;}
    const g=e.target.closest('.m'), m=g&&g.__m; let s2, f2;
    if(m&&m.state!=='off'){s2=m.s; f2=m.f;}
    else { const r=svg.getBoundingClientRect(), vy=(e.clientY-r.top)/r.height*VBH; if(vy<TOP-26||vy>Y1+26) return; s2=clamp(5-Math.round((vy-TOP)/GAP),0,5); f2=fretAt(e.clientX); }
    const fi=focusInfo(); if(fi&&(f2<fi.a||f2>fi.b)){const i=nearest(f2); if(i!=null) setFocus(i);}
    focusNote(s2,f2);
  });
  window.addEventListener('pointerup',()=>{setTimeout(()=>{st=null;},0);});
})();

  if(e.code==='Space'&&tag!=='BUTTON'){e.preventDefault(); if(playing&&S.sound==='off') syncTap(); else playing?stopPlay():startPlay();}

});

/* =================== Land It: coach, play along, listening, gig sheet =================== */
const LIT_MODES=['coach','along','free','gig'];
// the real tabs on Songsterr; songs without a known page get a Songsterr search
const SONGSTERR={'so-into-you':'https://www.songsterr.com/a/wsa/atlanta-rhythm-section-so-into-you-tab-s168027','war-pigs':'https://www.songsterr.com/a/wsa/black-sabbath-war-pigs-tab-s10137','sharp-dressed-man':'https://www.songsterr.com/a/wsa/zz-top-sharp-dressed-man-tab-s2433','get-back':'https://www.songsterr.com/a/wsa/beatles-get-back-tab-s22771','round-and-round':'https://www.songsterr.com/a/wsa/ratt-round-and-round-tab-s16671','la-isla-bonita-madonna-guitar-solo':'https://www.songsterr.com/a/wsa/madonna-la-isla-bonita-tab-s22862'};
function sgrUrl(sg){return SONGSTERR[sg.id]||('https://www.songsterr.com/?pattern='+encodeURIComponent((sg.title+' '+(sg.artist||'')).trim()));}
const DEGWORD={'R':'root','3':'3rd','♭3':'3rd','5':'5th','♭5':'♭5','♯5':'♯5','♭7':'♭7','7':'7th','6':'6th','9':'9th'};
const SSN=['E','A','D','G','B','e'], STR_LBL=['low E','A','D','G','B','high e'];
function alongOn(){return S.mode==='along'||(S.mode==='free'&&STEPS[S.step]&&STEPS[S.step].k==='solo');}
const STEPS=[{k:'listen',t:'Listen first'},{k:'box',t:'Your box'},{k:'notes',t:'Your 3 notes'},{k:'land',t:'Land it'},{k:'talk',t:'Ask, then answer'},{k:'solo',t:'Your starter solo'}];
S.mode='free';
S.step=clamp(+S.step||0,0,STEPS.length-1); S.myTurn=!!S.myTurn;

// the 3 notes worth landing on: the 3rd, the root, then the 7th (or the 5th)
function targets3(c){
  const role=r=>c.ints.find(i=>roleOf(i,c.ints)===r), t3=role('3'), t7=role('7'), t5=role('5'), out=[];
  [t3,0,t7!=null?t7:t5,t5].forEach(i=>{if(i!=null&&!out.includes(i)) out.push(i);});
  return out.slice(0,3).map(i=>{const dg=deg(i,c.ints); return {i,pc:mod(c.r+i),role:roleOf(i,c.ints),deg:dg,word:i===0?'root':(DEGWORD[dg]||dg)};});
}
function litBox(){const fi=S.str==null?focusInfo():null; if(!fi) return insts()[defaultFocus(1)]; if(fi.list.length===1) return fi.list[0];
  const keys=new Set(); fi.list.forEach(b=>b.keys.forEach(k=>keys.add(k))); return {k:fi.list[0].k,a:fi.a,b:fi.b,keys,list:fi.list};}
const subBox=(box,fr)=>(box.list||[box]).find(b=>fr>=b.a&&fr<=b.b)||box;
// every note you can reach in the box: the box's scale notes plus this chord's tones inside its frets
function poolFor(c,box){
  const K=FRETS+1, tm=tmap(c), out=new Map();
  for(let s2=0;s2<6;s2++) for(let fr=Math.max(0,box.a);fr<=Math.min(FRETS,box.b);fr++){const pc=mod(STD[s2]+fr), k=s2*K+fr, inBox=box.keys.has(k);
    if(!(inBox||tm.has(pc))) continue; const midi=STD[s2]+fr, o=out.get(midi); if(!o||(inBox&&!o.inBox)) out.set(midi,{s:s2,f:fr,midi,inBox});}
  return [...out.values()].sort((x,y)=>x.midi-y.midi);
}
function spotFor(pool,pc,ref,prevS){let best=null,bd=1e9; pool.forEach(p=>{if(mod(p.midi)!==pc) return; const d=Math.abs(p.midi-ref)+(p.s<=1?4:0)+(prevS!=null?3*Math.max(0,Math.abs(p.s-prevS)-2):0); if(d<bd){bd=d; best=p;}}); return best;}
function nearestPc(pool,pc,ref){let best=null,bd=1e9; pool.forEach(p=>{if(mod(p.midi)!==pc) return; const d=Math.abs(p.midi-ref); if(d<bd){bd=d; best=p;}}); return best;}
function boxMid(box){return (STD[2]+STD[3])/2+(box.a+box.b)/2;}
function phraseV(pool,end,up,v){if(!end) return []; const i=pool.indexOf(end); if(i<0) return [end]; const S=up?[[-2,-1,0],[-3,-1,0],[1,-1,0]]:[[2,1,0],[3,1,0],[-1,1,0]]; return S[v%3].map(o=>pool[clamp(i+o,0,pool.length-1)]).filter((p,k,a)=>k===0||p!==a[k-1]);}
function phrase3(pool,end,up){if(!end) return []; const i=pool.indexOf(end); if(i<0) return [end]; const ids=up?[i-2,i-1,i]:[i+2,i+1,i]; return ids.map(j=>pool[clamp(j,0,pool.length-1)]).filter((p,k,a)=>k===0||p!==a[k-1]);}

/* ---------- modes ---------- */
function enterLens(){ if(!S.freeSave) S.freeSave={lay:Object.assign({},S.lay),focus:S.focus,str:S.str}; S.lay={chord:true,pent:true,moves:false}; S.focus='1'; S.str=null; }
function leaveLens(){ if(S.freeSave){S.lay=S.freeSave.lay; S.focus=S.freeSave.focus; S.str=S.freeSave.str; S.freeSave=null;} }
function setMode(v){
  if(!LIT_MODES.includes(v)) return;
  if(v==='free') leaveLens(); else if(v!=='gig') enterLens();
  S.mode=v; save(); VIEW=null; document.body.dataset.mode=v; setPressed('modes',v);
  renderChips(); renderNeck(); renderTools(); renderCards(); requestAnimationFrame(centerOnFocus);
}
function renderModePanel(){const v=S.mode, so=alongOn(); document.body.classList.toggle('solo',so); if(v==='coach'||v==='free') renderCoach(); if(so){buildSolo(); renderAlong();} else if(v==='gig') renderGig();}
function syncPlayLabels(){document.querySelectorAll('[data-act="play"]').forEach(b=>b.textContent=playing?'■ Stop':'▶ Play'); const ap=$('alongPlay'); if(ap) ap.textContent=playing?'■ Stop':'▶ Play with the band';}

/* ---------- the 3 notes lens on the neck ---------- */
function lensLevel(){ if(S.str!=null) return 0; if(S.mode==='along') return 1; if(S.mode==='coach'){const k=STEPS[S.step].k; return (k==='notes'||k==='land'||k==='talk')?2:0;} return 0; }
function applyLens(fi){
  const lv=lensLevel(); if(!lv||!fi) return; const cur=curChord(), T=new Set(targets3(cur).map(t=>t.pc));
  M.forEach(m=>{ if(m.state!=='on') return; const pc=mod(STD[m.s]+m.f), inF=m.f>=fi.a&&m.f<=fi.b;
    if(inF&&T.has(pc)){m.o.classList.add('tgt'); m.o.classList.remove('rub');}
    else if(lv===2){m.o.classList.remove('arrive'); m.o.classList.replace('on','dim'); m.state='dim';} });
}

/* ---------- coach ---------- */
function uniqueChords(){const f=form(), seen=new Set(); return f.map((c,i)=>({c,i})).filter(o=>!seen.has(o.c.name)&&seen.add(o.c.name));}
function notePill(t,p){return `<span class="npill" style="--c:var(--n-${t.role})"><i>${esc(nm(t.pc))}</i>${t.word}${p?`<small>${p.f} on ${STR_LBL[p.s]}</small>`:''}${p&&!p.inBox?'<em class="nw">new</em>':''}</span>`;}
// a box note on B, G or high e that bends up to this note (whole step first, then half step)
function bendTo(box,pc,ref,semis){
  let best=null,bd=1e9; const K=FRETS+1;
  [4,3,5].forEach(s2=>(semis?[semis]:[2,1]).forEach(st=>{for(let fr=Math.max(1,box.a);fr<=Math.min(FRETS-2,box.b);fr++){ if(!box.keys.has(s2*K+fr)||(st===2&&fr<subBox(box,fr).a+2)) continue; const m=STD[s2]+fr; if(mod(m+st)!==pc) continue;
    const d=Math.abs(m+st-ref)+(st===1?1:0)+(s2===5?1:0); if(d<bd){bd=d; best={s:s2,f:fr,midi:m,inBox:true,bend:st};}}}));
  return best;
}
// target notes that sit outside the pentatonic shape, with the easiest way to reach each one
function newNotes(chs,box){
  const out=[], seen=new Set(), ref=boxMid(box), K=FRETS+1, FW=['index','middle','ring','pinky'];
  chs.forEach(({c})=>{const pool=poolFor(c,box); targets3(c).forEach(t=>{const p=spotFor(pool,t.pc,ref); if(!p||p.inBox||seen.has(c.name+t.pc)) return; seen.add(c.name+t.pc);
    const ways=[`fret ${p.f} on ${STR_LBL[p.s]} with your ${FW[clamp(p.f-subBox(box,p.f).a,0,3)]} finger`];
    const hm=box.keys.has(p.s*K+p.f-1)?p.f-1:(box.keys.has(p.s*K+p.f-2)?p.f-2:null); if(hm!=null) ways.push(`hammer on from ${hm} to ${p.f}`);
    const b=bendTo(box,t.pc,p.midi); if(b) ways.push(`bend ${b.f} on ${STR_LBL[b.s]} up ${b.bend===2?'a whole step':'a half step'}`);
    out.push(`<li><b>${esc(nm(t.pc))}</b>, the ${t.word} of ${esc(c.name)}: ${ways.join(', or ')}.</li>`);});});
  return out;
}
function notesTable(chs,box){
  const cn=form()[idx]&&form()[idx].name;
  return `<div class="nrows">${chs.map(({c,i})=>{const T=targets3(c), pool=poolFor(c,box), ref=boxMid(box);
    return `<button type="button" class="nrow${c.name===cn?' on':''}" data-chord="${i}" aria-label="Show the notes for ${esc(c.name)}"><b class="nch">${esc(c.name)}</b><span class="pills">${T.map(t=>notePill(t,spotFor(pool,t.pc,ref))).join('')}</span></button>`;}).join('')}</div>`;
}
let TALK=null;
function talkPhrases(chs,box){
  const A=chs[0].c, B=(A.bars>=4||!chs[1]?chs[0]:chs[1]).c, TA=targets3(A), TB=targets3(B), pa=poolFor(A,box), pb=poolFor(B,box), ref=boxMid(box);
  const askT=TA[2]||TA[0], ansT=TB.find(t=>t.i===0)||TB[0];
  const askEnd=nearestPc(pa,askT.pc,ref), ask=phrase3(pa,askEnd,true);
  const ansEnd=nearestPc(pb,ansT.pc,askEnd?askEnd.midi:ref), ans=phrase3(pb,ansEnd,false);
  return {A,B,ask,ans,askT,ansT};
}
function miniTab(ps,key){
  const w=Math.max(1,ps.length)*40+40;
  return `<svg viewBox="0 0 ${w} 96" width="${w}" height="96" aria-hidden="true">${[0,1,2,3,4,5].map(s2=>`<text x="6" y="${12+(5-s2)*14}" class="mkey">${SSN[s2]}</text><line x1="16" x2="${w}" y1="${12+(5-s2)*14}" y2="${12+(5-s2)*14}" class="tl"/>`).join('')}${ps.map((p,j)=>{const x=36+j*40, yy=12+(5-p.s)*14, wd=String(p.f).length>1?22:14; return `<g class="an" data-k="${key}${j}"><rect x="${x-wd/2}" y="${yy-8}" width="${wd}" height="16" rx="4"/><text x="${x}" y="${yy+.5}">${p.f}</text></g>`;}).join('')}</svg>`;
}
function talkBlock(chs,box){
  const P=TALK=talkPhrases(chs,box), same=P.A.name===P.B.name;
  return `<p>A solo is a conversation. ${same?'Ask for 2 bars, then answer for 2 bars. ':''}Over <b>${esc(P.A.name)}</b>, <b>ask</b>: 3 notes going up that stop on <b>${esc(nm(P.askT.pc))}</b>, the ${P.askT.word}. It hangs in the air. ${same?`Then <b>answer</b>, still over <b>${esc(P.A.name)}</b>`:`Over <b>${esc(P.B.name)}</b>, <b>answer</b>`}: 3 notes coming down that land on <b>${esc(nm(P.ansT.pc))}</b>, the root. It sounds finished.</p>
  <div class="talk"><div><span class="tlab">Ask · ${esc(P.A.name)}</span><div class="mini">${miniTab(P.ask,'ask')}<button class="btn2" type="button" data-act="ask">▶ Hear</button></div></div><div><span class="tlab">Answer · ${esc(P.B.name)}</span><div class="mini">${miniTab(P.ans,'ans')}<button class="btn2" type="button" data-act="ans">▶ Hear</button></div></div></div>
  <p class="sub">Then make up your own: any 3 notes in the box, as long as the ask stops on a hanging note and the answer lands on the root.</p>`;
}
function hearPhrase(ps,c,key){
  initAudio(); if(actx&&actx.resume) actx.resume(); const gap=60/bpm(), tm=tmap(c);
  ps.forEach((p,j)=>{pluck(realMidi(p.s,p.f),j*gap);
    setTimeout(()=>{litAt(p.s,p.f,gap*900,c,tm.has(mod(p.midi))?tm.get(mod(p.midi)):null); trailAt(p,j?ps[j-1]:null,gap);
      document.querySelectorAll('#coach .an.on').forEach(e=>e.classList.remove('on')); const e=document.querySelector(`#coach .an[data-k="${key}${j}"]`); if(e){e.classList.add('on'); if(j===ps.length-1) setTimeout(()=>e.classList.remove('on'),gap*1000);}},j*gap*1000);});
}
function renderCoach(){
  const el=$('coach'); if(!el) return; const st=STEPS[S.step], f=form(), box=litBox(), chs=uniqueChords();
  const loop=f.map(c=>`${c.name} for ${c.bars} bar${c.bars>1?'s':''}`).join(', then ');
  const playBtn=`<button class="btn2" type="button" data-act="play">${playing?'■ Stop':'▶ Play'}</button>`;
  let body='', acts='';
  if(st.k==='listen'){ body=`<p>The solo loops ${esc(loop)}. Press Play and count along with the counter. When it says <b>Ready</b>, a change is coming. When it says <b>Change</b>, the next beat is the new chord.</p><p class="sub">Want the real solo note for note? <a href="${esc(sgrUrl(song()))}" target="_blank" rel="noopener">Open it in Songsterr</a>, slow it down and loop it there. Then come back to see which notes it lands on.</p>`; acts=playBtn; }
  else if(st.k==='box'){ body=`<p>${S.focus==='all'?'All the boxes are showing, so these steps use the main one. ':''}Stay in <b>${box.list?'positions '+box.list.map(b=>POSN(b.k)).join(' + '):'position '+POSN(box.k)}</b>, frets <b>${box.a} to ${box.b}</b>. You already know ${box.list?'these shapes':'this shape'}.</p>${(()=>{const nn=newNotes(chs,box); return nn.length?`<p>${nn.length===1?'One note you need is':nn.length+' notes you need are'} not in the shape. Here is how to reach ${nn.length===1?'it':'each one'}, easiest first:</p><ul class="newn">${nn.join('')}</ul>`:'<p>Every note you need is already in it, so there is nothing new to finger.</p>';})()}<p class="sub">Want a different spot? Slide your boxes with the arrows under the neck, or pick 1 box, 2 boxes or All. These steps follow whatever you pick.</p>`; }
  else if(st.k==='notes'){ body=`<p>These are the notes that make each chord sound like itself. The <b>3rd</b> matters most. Tap a chord to light up its notes on the neck. The small label says which fret and string.</p>`+notesTable(chs,box); }
  else if(st.k==='land'){ body=`<p>Press Play. On <b>beat 1</b> of every chord, play one of its 3 glowing notes. In between, play anything in your box.</p><p class="sub">Tap <b>Listen</b> up top and Land It will tell you when you nail it.</p>`; acts=playBtn; }
  else if(st.k==='talk'){ body=talkBlock(chs,box); }
  else if(st.k==='solo'){ body=`<p>Now put it all together. Here is a simple solo built from your boxes and your 3 notes. It is right below: hear it once, then switch to <b>My turn</b> and play it with the band.</p>`; }
  const fresh=el.dataset.k!==S.step+'|'+song().id; el.dataset.k=S.step+'|'+song().id;
  el.innerHTML=`<div class="cstep${fresh?' enter':''}"><div class="cnav"><span class="cno">How to play it · Step ${S.step+1} of ${STEPS.length}</span><span class="dots">${STEPS.map((x,j)=>`<button type="button" class="dot${j===S.step?' on':''}" data-step="${j}" aria-label="Step ${j+1}: ${x.t}"></button>`).join('')}</span><button type="button" class="gigl" data-act="gig">All songs ↗</button></div>
    <h2>${st.t}</h2>${body}<div class="cacts">${acts}<span class="grow"></span><p class="score" id="coachScore"></p><button class="btn2 ghost" type="button" data-act="back"${S.step===0?' disabled':''}>Back</button><button class="btn2" type="button" data-act="fwd"${S.step===STEPS.length-1?' disabled':''}>Next</button></div></div>`;
  showScore();
}
function markCoachChord(){const cn=form()[idx]&&form()[idx].name; document.querySelectorAll('#coach .nrow').forEach(r=>{const c=form()[+r.dataset.chord]; r.classList.toggle('on',!!c&&c.name===cn);});}

/* ---------- gig sheet ---------- */
function songCard(id){
  const keep=S.cur; S.cur=id; invalidate();
  try{
    const sg=song(), ins=insts(), anc=S.fpos[fkey()]; let i=anc!=null?ins.findIndex(x=>x.a===anc):-1; if(i<0) i=Math.min(defaultFocus(1),ins.length-1);
    const box=ins[i], f=form(), seen=new Set(), t=tuning(), ref=boxMid(box);
    const rows=f.filter(c=>!seen.has(c.name)&&seen.add(c.name)).map(c=>{const pool=poolFor(c,box); return `<li><b class="gch">${esc(c.name)}</b><span class="pills">${targets3(c).map(x=>notePill(x,spotFor(pool,x.pc,ref))).join('')}</span></li>`;}).join('');
    return `<article class="gcard"><header><h3>${esc(sg.title)}</h3><span>${esc(sg.artist)}${sg.section?' · '+esc(sg.section):''}</span><span class="ghead"><button type="button" class="practice" data-song="${esc(sg.id)}">Practice this</button><a href="${esc(sgrUrl(sg))}" target="_blank" rel="noopener">Songsterr tab ↗</a></span></header><p class="gkey"><b>${esc(keyName())} ${keyWord()}</b>${t?` · ${TUN_SHORT[String(t)]} tuning, ${esc(nm(keyS()))} shapes`:''} · Box: position ${POSN(box.k)}, frets ${box.a} to ${box.b}</p><ul class="grows">${rows}</ul></article>`;
  } finally { S.cur=keep; invalidate(); }
}
function renderGig(){
  const el=$('gig'); if(!el) return; const lib=library();
  el.innerHTML=`<div class="enter"><div class="phead"><h2>Gig sheet</h2><button class="btn2" type="button" id="gigBack">Back to the neck</button></div><p class="plead">Every song, your box, and the 3 notes to land on each chord. The small label says which fret and string.</p><div class="gcards">${lib.map(sg=>songCard(sg.id)).join('')}</div></div>`;
}

$('gig').addEventListener('click',e=>{if(e.target.closest('#gigBack')){setMode('free'); window.scrollTo({top:0}); return;} const b=e.target.closest('.practice'); if(!b) return; S.step=2; selectSong(b.dataset.song); setMode('free'); window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});});
const SKINS=[{k:'classic',n:'Classic',bg:'#EEEAE4',ac:'#B4551C'},{k:'tweed',n:'Tweed',bg:'#E8DAC0',ac:'#8E2A23'},{k:'seafoam',n:'Seafoam',bg:'#D9EEE4',ac:'#DD4B36'},{k:'charvel',n:'Charvel purple',bg:'#EAE5F4',ac:'#6A3BBE'},{k:'halloween',n:'Halloween',bg:'#F3E1C6',ac:'#E8620E'}];
function applySkin(k){if(!SKINS.some(x=>x.k===k)) k='classic'; S.skin=k; if(k==='classic') delete document.documentElement.dataset.skin; else document.documentElement.dataset.skin=k;
  $('thPanel').innerHTML=SKINS.map(x=>`<button type="button" data-skin="${x.k}" aria-pressed="${x.k===k}"><i style="background:linear-gradient(135deg,${x.bg} 0 50%,${x.ac} 50%)"></i>${x.n}</button>`).join('');}
function thOpen(on){$('thPanel').hidden=!on; $('thmBtn').setAttribute('aria-expanded',String(on));}
$('thmBtn').addEventListener('click',e=>{e.stopPropagation(); thOpen($('thPanel').hidden);});
$('thPanel').addEventListener('click',e=>{const b=e.target.closest('button[data-skin]'); if(!b) return; applySkin(b.dataset.skin); save(); thOpen(false);});
document.addEventListener('click',e=>{if(!e.target.closest('.thwrap')) thOpen(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape') thOpen(false);});
applySkin(S.skin);
$('modes').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) setMode(b.dataset.v);});
document.body.dataset.mode=S.mode; setPressed('modes',S.mode);
if(S.freeSave) leaveLens();

buildNeck(); renderAll(); $('play').textContent=S.sound==='off'?'▶ Start on 1':'▶ Play';
requestAnimationFrame(centerOnFocus);
if(location.protocol==='file:') window.__ws={focusInfo,insts,form,setFocus};
(async()=>{
  const c=window.claude; if(!c||typeof c.use!=='function') return;
  samplerP=c.use('sample').then(s=>{sampler=s||null; return sampler;}).catch(()=>null);
  try{
    db=await c.use('db');
    if(db) db.collection('songs').onSnapshot(snap=>{
      dbSongs=snap.docs.map(d=>normalize(Object.assign({},d.data()||{},{id:d.id,where:'shared'}))).filter(Boolean);
      const before=song().id; invalidate(); if(song().id!==before&&!playing) renderAll(); if($('songDlg').open) renderLib();
    },()=>{db=null;});
  }catch(e){db=null;}
})();

})();
</script>
</body></html>
